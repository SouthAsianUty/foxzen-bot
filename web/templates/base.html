<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Foxzen Bot Admin{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        },
                        darkbg: '#0f172a',
                        darkcard: '#1e293b',
                        darkborder: '#334155'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col md:flex-row antialiased font-sans">

    <!-- Mobile Header -->
    <div class="md:hidden flex items-center justify-between bg-darkcard p-4 border-b border-darkborder">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">🦊</span>
            <span class="font-bold text-lg text-emerald-400">Foxzen Admin</span>
        </div>
        <button id="mobileMenuBtn" class="text-slate-300 hover:text-white focus:outline-none">
            <i class="fa-solid fa-bars text-xl"></i>
        </button>
    </div>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="w-full md:w-64 bg-darkcard border-r border-darkborder flex flex-col justify-between hidden md:flex min-h-screen">
        <div>
            <!-- Logo Brand -->
            <div class="p-6 border-b border-darkborder flex items-center space-x-3">
                <span class="text-3xl">🦊</span>
                <div>
                    <h1 class="font-extrabold text-xl tracking-tight text-emerald-400">Foxzen Digital</h1>
                    <p class="text-xs text-slate-400">Store & Binance Hub</p>
                </div>
            </div>

            <!-- Nav Links -->
            <nav class="p-4 space-y-1.5 text-sm font-medium">
                <a href="/dashboard" class="flex items-center space-x-3 px-4 py-3 rounded-lg transition-all {% if active_page == 'dashboard' %}bg-emerald-600 text-white shadow-lg shadow-emerald-900/30{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
                    <i class="fa-solid fa-chart-pie w-5 text-center"></i>
                    <span>Dashboard</span>
                </a>

                <a href="/products" class="flex items-center space-x-3 px-4 py-3 rounded-lg transition-all {% if active_page == 'products' %}bg-emerald-600 text-white shadow-lg shadow-emerald-900/30{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
                    <i class="fa-solid fa-tags w-5 text-center"></i>
                    <span>Products & Catalog</span>
                </a>

                <a href="/stock" class="flex items-center space-x-3 px-4 py-3 rounded-lg transition-all {% if active_page == 'stock' %}bg-emerald-600 text-white shadow-lg shadow-emerald-900/30{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
                    <i class="fa-solid fa-boxes-stacked w-5 text-center"></i>
                    <span>Stock & Credentials</span>
                </a>

                <a href="/providers" class="flex items-center space-x-3 px-4 py-3 rounded-lg transition-all {% if active_page == 'providers' %}bg-emerald-600 text-white shadow-lg shadow-emerald-900/30{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
                    <i class="fa-solid fa-plug-circle-bolt w-5 text-center"></i>
                    <span>Reseller APIs</span>
                </a>

                <a href="/orders" class="flex items-center space-x-3 px-4 py-3 rounded-lg transition-all {% if active_page == 'orders' %}bg-emerald-600 text-white shadow-lg shadow-emerald-900/30{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
                    <i class="fa-solid fa-receipt w-5 text-center"></i>
                    <span>Orders & Payments</span>
                </a>

                <a href="/users" class="flex items-center space-x-3 px-4 py-3 rounded-lg transition-all {% if active_page == 'users' %}bg-emerald-600 text-white shadow-lg shadow-emerald-900/30{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
                    <i class="fa-solid fa-wallet w-5 text-center"></i>
                    <span>Users & Wallets</span>
                </a>

                <a href="/broadcast" class="flex items-center space-x-3 px-4 py-3 rounded-lg transition-all {% if active_page == 'broadcast' %}bg-emerald-600 text-white shadow-lg shadow-emerald-900/30{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
                    <i class="fa-solid fa-paper-plane w-5 text-center"></i>
                    <span>Bot Broadcast</span>
                </a>

                <a href="/settings" class="flex items-center space-x-3 px-4 py-3 rounded-lg transition-all {% if active_page == 'settings' %}bg-emerald-600 text-white shadow-lg shadow-emerald-900/30{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
                    <i class="fa-solid fa-gear w-5 text-center"></i>
                    <span>Settings & Binance API</span>
                </a>
            </nav>
        </div>

        <!-- Admin user footer -->
        <div class="p-4 border-t border-darkborder flex items-center justify-between bg-slate-900/50">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-sm">
                    A
                </div>
                <div>
                    <p class="text-xs font-semibold text-slate-200">Admin</p>
                    <p class="text-[10px] text-emerald-400">● Bot Online</p>
                </div>
            </div>
            <a href="/logout" title="Logout" class="text-slate-400 hover:text-rose-400 transition-colors p-1.5">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </a>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8">
        {% if alert_msg %}
        <div class="mb-6 p-4 rounded-xl border {% if alert_type == 'success' %}bg-emerald-950/40 border-emerald-500/40 text-emerald-300{% elif alert_type == 'error' %}bg-rose-950/40 border-rose-500/40 text-rose-300{% else %}bg-blue-950/40 border-blue-500/40 text-blue-300{% endif %} flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid {% if alert_type == 'success' %}fa-circle-check{% elif alert_type == 'error' %}fa-circle-xmark{% else %}fa-circle-info{% endif %} text-lg"></i>
                <span class="text-sm font-medium">{{ alert_msg }}</span>
            </div>
            <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <script>
        // Mobile menu toggle
        const menuBtn = document.getElementById('mobileMenuBtn');
        const sidebar = document.getElementById('sidebar');
        if (menuBtn && sidebar) {
            menuBtn.addEventListener('click', () => {
                sidebar.classList.toggle('hidden');
            });
        }
    </script>
</body>
</html>
